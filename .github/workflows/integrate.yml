name: Continuous Integration

on:
  push:
    branches:
      - main
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch_state_after:
    if: github.head_ref == 'fix/stable-state-after-sync'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/stable-state-after-sync
      - name: Wire stable state_after semantics
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('lib/src/client.dart')
          c = p.read_text()

          def once(old, new, label):
              global c
              n = c.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              c = c.replace(old, new, 1)

          once(
              "    final syncResp = await sync(\n      filter: filter,\n      timeout: _archiveCacheBusterTimeout,\n      setPresence: syncPresence,\n    );\n",
              "    final syncResp = await sync(\n      filter: filter,\n      timeout: _archiveCacheBusterTimeout,\n      setPresence: syncPresence,\n      useStateAfter: true,\n    );\n",
              'archive sync request',
          )
          once(
              "          sync(\n            filter: syncFilterId,\n            since: prevBatch,\n            timeout: timeout?.inMilliseconds,\n            setPresence: syncPresence,\n          ).then(Future<SyncUpdate?>.value).catchError((e) {\n",
              "          sync(\n            filter: syncFilterId,\n            since: prevBatch,\n            timeout: timeout?.inMilliseconds,\n            setPresence: syncPresence,\n            useStateAfter: true,\n          ).then(Future<SyncUpdate?>.value).catchError((e) {\n",
              'main sync request',
          )
          once(
              "  Future<void> _handleRoomEvents(\n    Room room,\n    List<StrippedStateEvent> events,\n    EventUpdateType type, {\n    bool store = true,\n  }) async {\n",
              "  Future<void> _handleRoomEvents(\n    Room room,\n    List<StrippedStateEvent> events,\n    EventUpdateType type, {\n    bool store = true,\n    bool updateRoomState = true,\n  }) async {\n",
              'room event handler signature',
          )
          once(
              '      await _updateRoomsByEventUpdate(room, event, type);\n',
              '      await _updateRoomsByEventUpdate(\n        room,\n        event,\n        type,\n        updateRoomState: updateRoomState,\n      );\n',
              'room update call',
          )
          once(
              "  Future<void> _updateRoomsByEventUpdate(\n    Room room,\n    StrippedStateEvent eventUpdate,\n    EventUpdateType type,\n  ) async {\n",
              "  Future<void> _updateRoomsByEventUpdate(\n    Room room,\n    StrippedStateEvent eventUpdate,\n    EventUpdateType type, {\n    bool updateRoomState = true,\n  }) async {\n",
              'room updater signature',
          )
          once(
              "        // Update the room state:\n        final stateKey = event.stateKey;\n        if (stateKey != null) {\n",
              "        // With state_after present, timeline state events remain\n        // timeline entries but must not mutate the current room state.\n        final stateKey = event.stateKey;\n        if (stateKey != null && updateRoomState) {\n",
              'room state mutation guard',
          )

          old = '        final state = syncRoomUpdate.state;\n'
          n = c.count(old)
          if n != 2:
              raise SystemExit(f'joined state selection: expected 2 matches, got {n}')
          c = c.replace(
              old,
              '        final stateAfter = syncRoomUpdate.stateAfter;\n'
              '        final state = stateAfter ?? syncRoomUpdate.state;\n',
          )

          once(
              '          await _handleRoomEvents(room, timelineEvents, timelineUpdateType);\n',
              '          await _handleRoomEvents(\n'
              '            room,\n'
              '            timelineEvents,\n'
              '            timelineUpdateType,\n'
              '            updateRoomState: stateAfter == null,\n'
              '          );\n',
              'joined timeline state suppression',
          )
          once(
              "          await _handleRoomEvents(\n            room,\n            timelineEvents,\n            timelineUpdateType,\n            store: false,\n          );\n",
              "          await _handleRoomEvents(\n            room,\n            timelineEvents,\n            timelineUpdateType,\n            store: false,\n            updateRoomState: syncRoomUpdate.stateAfter == null,\n          );\n",
              'left timeline state suppression',
          )
          once(
              '    final stateEvents = roomUpdate.state;\n',
              '    final stateEvents = roomUpdate.stateAfter ?? roomUpdate.state;\n',
              'archived state selection',
          )
          once(
              "      await _handleRoomEvents(\n        archivedRoom,\n        timelineEvents.toList(),\n        EventUpdateType.timeline,\n        store: false,\n      );\n",
              "      await _handleRoomEvents(\n        archivedRoom,\n        timelineEvents.toList(),\n        EventUpdateType.timeline,\n        store: false,\n        updateRoomState: roomUpdate.stateAfter == null,\n      );\n",
              'archived timeline state suppression',
          )

          p.write_text(c)
          PY
      - name: Commit source and restore workflow
        run: |
          git fetch origin Extera
          git checkout origin/Extera -- .github/workflows/integrate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/client.dart .github/workflows/integrate.yml
          git commit -m "feat: apply stable state_after sync semantics"
          git push origin HEAD:fix/stable-state-after-sync

  dart:
    permissions:
      contents: read
    uses: famedly/frontend-ci-templates/.github/workflows/dart.yml@v1.1.0
    with:
      env_file: ".github/workflows/versions.env"

  general:
    permissions:
      contents: read
    uses: famedly/frontend-ci-templates/.github/workflows/general.yml@main

  reuse-compliance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check licenses
        uses: fsfe/reuse-action@v5

  e2ee_test:
    runs-on: ubuntu-latest-16core
    timeout-minutes: 30
    strategy:
      matrix:
        homeserver: [synapse, dendrite, conduit]
      # since the dendrite job is optional, actually run all tests to the end instead of failing on first error.
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - run: cat .github/workflows/versions.env >> $GITHUB_ENV
      - uses: dart-lang/setup-dart@a57a6c04cf7d4840e88432aad6281d1e125f0d46
        with:
          sdk: ${{ env.dart_version }}
      - uses: famedly/backend-build-workflows/.github/actions/rust-prepare@v5
      - name: Run tests
        run: |
          export HOMESERVER_IMPLEMENTATION=${{matrix.homeserver}}
          export HOMESERVER="localhost:80"
          scripts/integration-server-${{matrix.homeserver}}.sh 2>&1 > /dev/null &
          source scripts/integration-create-environment-variables.sh
          scripts/integration-prepare-homeserver.sh
          dart pub get --no-example
          scripts/prepare_vodozemac.sh
          dart --define=HOMESERVER=$HOMESERVER --define=USER1_NAME=$USER1_NAME --define=USER2_NAME=$USER2_NAME --define=USER3_NAME=$USER3_NAME --define=USER1_PW=$USER1_PW --define=USER2_PW=$USER2_PW --define=USER3_PW=$USER3_PW test test_driver/matrixsdk_test.dart -p vm

  coverage_without_olm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NO_OLM: 1
    steps:
      - uses: actions/checkout@v7
      - run: cat .github/workflows/versions.env >> $GITHUB_ENV
      - uses: dart-lang/setup-dart@a57a6c04cf7d4840e88432aad6281d1e125f0d46
        with:
          sdk: ${{ env.dart_version }}
      - name: Run tests
        run: |
          sudo apt-get update && sudo apt-get install --no-install-recommends --no-install-suggests -y lcov libsqlite3-0 libsqlite3-dev
          ./scripts/test.sh
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage_without_olm
          path: coverage_dir/
          retention-days: 1

  coverage:
    #runs-on: arm-ubuntu-latest-16core
    runs-on: ubuntu-latest-16core
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: cat .github/workflows/versions.env >> $GITHUB_ENV
      - uses: dart-lang/setup-dart@a57a6c04cf7d4840e88432aad6281d1e125f0d46
        with:
          sdk: ${{ env.dart_version }}
          #architecture: "arm64"
      - uses: famedly/backend-build-workflows/.github/actions/rust-prepare@v5
      - name: Run tests
        run: |
          sudo apt-get update && sudo apt-get install --no-install-recommends --no-install-suggests -y lcov libsqlite3-0 libsqlite3-dev libssl3
          ./scripts/prepare_vodozemac.sh
          ./scripts/test.sh
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage_dir/
          retention-days: 1

  merge_coverage:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [coverage, coverage_without_olm]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
      - name: Merge lcov files
        run: |
          sudo apt-get -y install lcov
          lcov -a coverage/lcov.info -a coverage_without_olm/lcov.info -o merged.info
          genhtml merged.info -o merged
          echo $(lcov --summary merged.info | grep 'lines......:') >> $GITHUB_STEP_SUMMARY
      - name: Codecov - Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          files: ./merged.info, ./coverage/lcov.info, ./coverage_without_olm/lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: merged
          path: merged/
          retention-days: 1

  dart_web_compatible:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: cat .github/workflows/versions.env >> $GITHUB_ENV
      - uses: dart-lang/setup-dart@a57a6c04cf7d4840e88432aad6281d1e125f0d46
        with:
          sdk: ${{ env.dart_version }}
      - name: Ensure SDK compiles on web
        run: |
          pushd web_test
          dart pub get
          dart run webdev build

  dart_wasm_compatible:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: cat .github/workflows/versions.env >> $GITHUB_ENV
      - uses: dart-lang/setup-dart@a57a6c04cf7d4840e88432aad6281d1e125f0d46
        with:
          sdk: ${{ env.dart_version }}
      - name: Ensure SDK compiles to WebAssembly
        run: |
          pushd web_test
          dart pub get
          dart compile wasm web/main.dart -o build/web_test.wasm

  database_web_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NO_OLM: 1
    steps:
      - uses: actions/checkout@v7
      - run: cat .github/workflows/versions.env >> $GITHUB_ENV
      - uses: dart-lang/setup-dart@a57a6c04cf7d4840e88432aad6281d1e125f0d46
        with:
          sdk: ${{ env.dart_version }}
      - uses: browser-actions/setup-chrome@v1
      - name: Run tests
        run: |
          dart pub get --no-example
          dart test test/box_test.dart --platform chrome

  pub-dev-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cat .github/workflows/versions.env >> $GITHUB_ENV
      - uses: dart-lang/setup-dart@a57a6c04cf7d4840e88432aad6281d1e125f0d46
        with:
          sdk: ${{ env.dart_version }}
      - name: pub.dev publish dry run
        run: |
          dart pub get --no-example
          dart pub publish --dry-run

  # Lint/analyze the example app so breaking SDK changes also enforce an
  # example update.
  example_analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze

  # Build the example as a web app so it can be reviewed on any pull request.
  example_build_web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build web --base-href "/matrix-example-chat/"
      - uses: actions/upload-artifact@v7
        with:
          name: matrix-example-chat-web
          path: example/build/web/
          retention-days: 7

  # Call the publish workflow only when all tests pass and this is a tag push
  call_publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      [
        e2ee_test,
        dart_web_compatible,
        dart_wasm_compatible,
        database_web_tests,
        pub-dev-dry-run,
      ]
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish.yml

name: Apply state-after source patch

on:
  push:
    branches:
      - fix/stable-state-after-sync

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/stable-state-after-sync
      - name: Apply source patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              return text.replace(old, new, 1)

          p = Path('lib/matrix_api_lite/model/sync_update.dart')
          s = p.read_text()
          s = once(s, '  List<MatrixEvent>? state;\n  TimelineUpdate? timeline;\n', '  List<MatrixEvent>? state;\n  List<MatrixEvent>? stateAfter;\n  TimelineUpdate? timeline;\n', 'joined fields')
          s = once(s, '    this.summary,\n    this.state,\n    this.timeline,\n', '    this.summary,\n    this.state,\n    this.stateAfter,\n    this.timeline,\n', 'joined constructor')
          s = once(s, "      state = json\n          .tryGetMap<String, List<Object?>>('state')?['events']\n          ?.map((i) => MatrixEvent.fromJson(i as Map<String, Object?>))\n          .toList(),\n      timeline = json.tryGetFromJson('timeline', TimelineUpdate.fromJson),\n", "      state = json\n          .tryGetMap<String, List<Object?>>('state')?['events']\n          ?.map((i) => MatrixEvent.fromJson(i as Map<String, Object?>))\n          .toList(),\n      stateAfter = json\n          .tryGetMap<String, List<Object?>>('state_after')?['events']\n          ?.map((i) => MatrixEvent.fromJson(i as Map<String, Object?>))\n          .toList(),\n      timeline = json.tryGetFromJson('timeline', TimelineUpdate.fromJson),\n", 'joined fromJson')
          s = once(s, "    if (state != null) {\n      data['state'] = {'events': state!.map((i) => i.toJson()).toList()};\n    }\n    if (timeline != null) {\n", "    if (state != null) {\n      data['state'] = {'events': state!.map((i) => i.toJson()).toList()};\n    }\n    if (stateAfter != null) {\n      data['state_after'] = {'events': stateAfter!.map((i) => i.toJson()).toList()};\n    }\n    if (timeline != null) {\n", 'joined toJson')
          s = once(s, 'class LeftRoomUpdate extends SyncRoomUpdate {\n  List<MatrixEvent>? state;\n  TimelineUpdate? timeline;\n', 'class LeftRoomUpdate extends SyncRoomUpdate {\n  List<MatrixEvent>? state;\n  List<MatrixEvent>? stateAfter;\n  TimelineUpdate? timeline;\n', 'left fields')
          s = once(s, '  LeftRoomUpdate({this.state, this.timeline, this.accountData});\n', '  LeftRoomUpdate({this.state, this.stateAfter, this.timeline, this.accountData});\n', 'left constructor')
          s = once(s, "  LeftRoomUpdate.fromJson(Map<String, Object?> json)\n    : state = json\n          .tryGetMap<String, List<Object?>>('state')?['events']\n          ?.map((i) => MatrixEvent.fromJson(i as Map<String, Object?>))\n          .toList(),\n      timeline = json.tryGetFromJson('timeline', TimelineUpdate.fromJson),\n", "  LeftRoomUpdate.fromJson(Map<String, Object?> json)\n    : state = json\n          .tryGetMap<String, List<Object?>>('state')?['events']\n          ?.map((i) => MatrixEvent.fromJson(i as Map<String, Object?>))\n          .toList(),\n      stateAfter = json\n          .tryGetMap<String, List<Object?>>('state_after')?['events']\n          ?.map((i) => MatrixEvent.fromJson(i as Map<String, Object?>))\n          .toList(),\n      timeline = json.tryGetFromJson('timeline', TimelineUpdate.fromJson),\n", 'left fromJson')
          s = once(s, "    if (state != null) {\n      data['state'] = {'events': state!.map((i) => i.toJson()).toList()};\n    }\n    if (timeline != null) {\n", "    if (state != null) {\n      data['state'] = {'events': state!.map((i) => i.toJson()).toList()};\n    }\n    if (stateAfter != null) {\n      data['state_after'] = {'events': stateAfter!.map((i) => i.toJson()).toList()};\n    }\n    if (timeline != null) {\n", 'left toJson')
          p.write_text(s)

          p = Path('lib/src/client.dart')
          c = p.read_text()
          c = once(c, "    final syncResp = await sync(\n      filter: filter,\n      timeout: _archiveCacheBusterTimeout,\n      setPresence: syncPresence,\n    );\n", "    final syncResp = await sync(\n      filter: filter,\n      timeout: _archiveCacheBusterTimeout,\n      setPresence: syncPresence,\n      useStateAfter: true,\n    );\n", 'archive request')
          c = once(c, "          sync(\n            filter: syncFilterId,\n            since: prevBatch,\n            timeout: timeout?.inMilliseconds,\n            setPresence: syncPresence,\n          ).then(Future<SyncUpdate?>.value).catchError((e) {\n", "          sync(\n            filter: syncFilterId,\n            since: prevBatch,\n            timeout: timeout?.inMilliseconds,\n            setPresence: syncPresence,\n            useStateAfter: true,\n          ).then(Future<SyncUpdate?>.value).catchError((e) {\n", 'main request')
          c = once(c, "  Future<void> _handleRoomEvents(\n    Room room,\n    List<StrippedStateEvent> events,\n    EventUpdateType type, {\n    bool store = true,\n  }) async {\n", "  Future<void> _handleRoomEvents(\n    Room room,\n    List<StrippedStateEvent> events,\n    EventUpdateType type, {\n    bool store = true,\n    bool updateRoomState = true,\n  }) async {\n", 'handler signature')
          c = once(c, '      await _updateRoomsByEventUpdate(room, event, type);\n', '      await _updateRoomsByEventUpdate(\n        room,\n        event,\n        type,\n        updateRoomState: updateRoomState,\n      );\n', 'handler call')
          c = once(c, "  Future<void> _updateRoomsByEventUpdate(\n    Room room,\n    StrippedStateEvent eventUpdate,\n    EventUpdateType type,\n  ) async {\n", "  Future<void> _updateRoomsByEventUpdate(\n    Room room,\n    StrippedStateEvent eventUpdate,\n    EventUpdateType type, {\n    bool updateRoomState = true,\n  }) async {\n", 'updater signature')
          c = once(c, "        // Update the room state:\n        final stateKey = event.stateKey;\n        if (stateKey != null) {\n", "        // state_after makes timeline state events historical only.\n        final stateKey = event.stateKey;\n        if (stateKey != null && updateRoomState) {\n", 'state guard')
          old = '        final state = syncRoomUpdate.state;\n'
          if c.count(old) != 2:
              raise SystemExit(f'joined state selection: expected 2, got {c.count(old)}')
          c = c.replace(old, '        final stateAfter = syncRoomUpdate.stateAfter;\n        final state = stateAfter ?? syncRoomUpdate.state;\n')
          c = once(c, '          await _handleRoomEvents(room, timelineEvents, timelineUpdateType);\n', '          await _handleRoomEvents(\n            room,\n            timelineEvents,\n            timelineUpdateType,\n            updateRoomState: stateAfter == null,\n          );\n', 'joined timeline')
          c = once(c, "          await _handleRoomEvents(\n            room,\n            timelineEvents,\n            timelineUpdateType,\n            store: false,\n          );\n", "          await _handleRoomEvents(\n            room,\n            timelineEvents,\n            timelineUpdateType,\n            store: false,\n            updateRoomState: syncRoomUpdate.stateAfter == null,\n          );\n", 'left timeline')
          c = once(c, '    final stateEvents = roomUpdate.state;\n', '    final stateEvents = roomUpdate.stateAfter ?? roomUpdate.state;\n', 'archive state')
          c = once(c, "      await _handleRoomEvents(\n        archivedRoom,\n        timelineEvents.toList(),\n        EventUpdateType.timeline,\n        store: false,\n      );\n", "      await _handleRoomEvents(\n        archivedRoom,\n        timelineEvents.toList(),\n        EventUpdateType.timeline,\n        store: false,\n        updateRoomState: roomUpdate.stateAfter == null,\n      );\n", 'archive timeline')
          p.write_text(c)

          Path('test/state_after_sync_test.dart').write_text(r'''// SPDX-FileCopyrightText: 2026 Famedly GmbH
//
// SPDX-License-Identifier: AGPL-3.0-or-later

import 'package:matrix/matrix.dart';
import 'package:test/test.dart';

import 'fake_client.dart';

Map<String, Object?> _nameEvent(String name, String eventId) => {
  'sender': '@alice:example.com',
  'type': EventTypes.RoomName,
  'content': {'name': name},
  'state_key': '',
  'origin_server_ts': 1417731086799,
  'event_id': eventId,
};

void main() {
  test('sync models preserve state_after presence including empty', () {
    final update = SyncUpdate.fromJson({
      'next_batch': 'next',
      'rooms': {
        'join': {
          '!joined:example.com': {
            'state_after': {'events': <Object?>[]},
          },
        },
        'leave': {
          '!left:example.com': {
            'state_after': {
              'events': [_nameEvent('Left', r'$left')],
            },
          },
        },
      },
    });
    expect(update.rooms!.join!['!joined:example.com']!.stateAfter, isEmpty);
    expect(update.rooms!.leave!['!left:example.com']!.stateAfter, hasLength(1));
    final json = update.toJson();
    final rooms = json['rooms'] as Map<String, Object?>;
    final join = rooms['join'] as Map<String, Object?>;
    final joined = join['!joined:example.com'] as Map<String, Object?>;
    expect(joined.containsKey('state_after'), isTrue);
  });

  test('state_after wins over timeline state events', () async {
    final client = await getClient();
    await client.abortSync();
    final room = client.getRoomById('!726s6s6q:example.com')!;
    await client.handleSync(SyncUpdate.fromJson({
      'next_batch': 'state-after-test',
      'rooms': {
        'join': {
          room.id: {
            'state_after': {
              'events': [_nameEvent('After timeline', r'$after')],
            },
            'timeline': {
              'events': [_nameEvent('Inside timeline', r'$timeline')],
            },
          },
        },
      },
    }));
    expect(room.name, 'After timeline');
  });

  test('legacy sync applies timeline state without state_after', () async {
    final client = await getClient();
    await client.abortSync();
    final room = client.getRoomById('!726s6s6q:example.com')!;
    await client.handleSync(SyncUpdate.fromJson({
      'next_batch': 'legacy-state-test',
      'rooms': {
        'join': {
          room.id: {
            'state': {
              'events': [_nameEvent('Before timeline', r'$before')],
            },
            'timeline': {
              'events': [_nameEvent('Timeline wins', r'$legacyTimeline')],
            },
          },
        },
      },
    }));
    expect(room.name, 'Timeline wins');
  });
}
''')
          PY
      - name: Commit patched source
        run: |
          rm .github/workflows/apply-state-after-sync.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/matrix_api_lite/model/sync_update.dart lib/src/client.dart test/state_after_sync_test.dart .github/workflows/apply-state-after-sync.yaml
          git commit -m "feat: support stable state_after sync semantics"
          git push origin HEAD:fix/stable-state-after-sync
